<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Life OS</title>
  <link rel="stylesheet" href="static/css/styles.css" />
</head>
<body>
  <div class="page">
    <aside class="sidebar card-soft">
      <div class="logo">◻︎◻︎</div>
      <nav id="nav"></nav>
      <button class="nav-item settings">⚙<span>Settings</span></button>
    </aside>

    <main class="main card-soft">
      <header class="topbar">
        <div class="title-wrap">
          <div class="mini-logo">◻︎◻︎</div>
          <div>
            <h1>Welcome back, Kristin 👋</h1>
            <p>Let's make today productive</p>
          </div>
        </div>
        <div class="actions">
          <button class="icon-circle"></button>
          <button class="icon-circle">☾</button>
          <button class="icon-circle">🔔</button>
          <div class="avatar"></div>
        </div>
      </header>

      <section class="content-grid">
        <div class="left-column">
          <section class="card panel" id="overview"></section>
          <section class="card panel" id="tasksBoard"></section>
          <section class="card panel" id="upcoming"></section>
        </div>

        <aside class="right-column">
          <section class="card panel" id="quickCapture"></section>
          <section class="card panel" id="goals"></section>
          <section class="card panel" id="recentNotes"></section>
        </aside>
      </section>
    </main>
  </div>
  <script src="static/js/app.js"></script>
</body>
</html>
